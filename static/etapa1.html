<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("dashtop_tema") || "dark");</script>
  <title>Dash Top — Enviar planilha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="estilo.css" />
  <script src="tema.js"></script>
</head>
<body>
  <main>
    <div class="cabecalho-app">
      <div class="marca">Dash Top</div>
      <div class="acoes-cabecalho">
        <button type="button" class="botao-tema" id="botao-tema" aria-label="Alternar tema"></button>
      </div>
    </div>

    <h1>1. Envie sua planilha</h1>
    <p class="subtitulo">Formatos aceitos: .xlsx, .xls ou .csv</p>

    <div class="dropzone" id="dropzone">
      <p id="texto-dropzone">Arraste o arquivo aqui ou clique para selecionar</p>
      <input type="file" id="input-arquivo" accept=".xlsx,.xls,.csv" style="display:none" />
    </div>

    <p class="erro" id="mensagem-erro" style="display:none"></p>
  </main>

  <script>
    const dropzone = document.getElementById("dropzone");
    const input = document.getElementById("input-arquivo");
    const textoDropzone = document.getElementById("texto-dropzone");
    const mensagemErro = document.getElementById("mensagem-erro");

    dropzone.addEventListener("click", () => input.click());

    dropzone.addEventListener("dragover", (evento) => {
      evento.preventDefault();
      dropzone.classList.add("arrastando");
    });

    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("arrastando");
    });

    dropzone.addEventListener("drop", (evento) => {
      evento.preventDefault();
      dropzone.classList.remove("arrastando");
      if (evento.dataTransfer.files.length > 0) {
        enviarArquivo(evento.dataTransfer.files[0]);
      }
    });

    input.addEventListener("change", () => {
      if (input.files.length > 0) {
        enviarArquivo(input.files[0]);
      }
    });

    async function enviarArquivo(arquivo) {
      mensagemErro.style.display = "none";
      textoDropzone.textContent = `Enviando "${arquivo.name}"...`;

      const formData = new FormData();
      formData.append("arquivo", arquivo);

      try {
        const resposta = await fetch("/api/upload", {
          method: "POST",
          body: formData,
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          throw new Error(dados.detail || "Erro ao enviar o arquivo.");
        }

        localStorage.setItem("dashtop_sessao", JSON.stringify(dados));
        window.location.href = "etapa2.html";
      } catch (erro) {
        textoDropzone.textContent = "Arraste o arquivo aqui ou clique para selecionar";
        mensagemErro.textContent = erro.message;
        mensagemErro.style.display = "block";
      }
    }
  </script>
</body>
</html>
